repos:
  - repo: local
    hooks:
      - id: cargo-autoinherit
        name: cargo-autoinherit
        entry: cargo autoinherit
        language: system
        types: [rust]
        stages: [pre-commit]
        pass_filenames: false

      - id: cargo-sort
        name: cargo-sort
        entry: cargo sort -w
        language: system
        types: [rust]
        stages: [pre-commit]
        pass_filenames: false

      - id: cargo-fmt
        name: cargo-fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        stages: [pre-commit]
        pass_filenames: false

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.21.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
