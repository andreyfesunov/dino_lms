[workspace]
resolver = "3"
members = ["auth", "config", "courses", "db", "initializer", "kernel", "web"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
argon2 = "0.5"
async-trait = "0.1"
auth = { path = "auth" }
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.55", default-features = false, features = ["shortcodes"] }
config = { path = "config" }
courses = { path = "courses" }
db = { path = "db" }
figment = { version = "0.10", features = ["env", "toml"] }
fluent-templates = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
kernel = { path = "kernel" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
toml = "0.9"
topcoat = { version = "0.9.0", features = ["tailwind"] }
uuid = { version = "1", features = ["serde", "v4"] }
