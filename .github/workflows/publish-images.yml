name: Publish images

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      image-prefix: ${{ steps.release.outputs.image-prefix }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate release version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION must be a release version such as 0.1.0 or 0.2.0-rc.1."
            exit 1
          fi
          if [[ "${RELEASE_TAG#v}" != "$version" ]]; then
            echo "::error::Git tag must match VERSION (optional v prefix)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image-prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: lms/go.mod
          cache-dependency-path: lms/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Check API
        run: |
          go -C lms test ./...
          go -C lms vet ./...

      - name: Check client
        run: |
          npm --prefix client ci --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=registry.truvisibility.com
          npm --prefix client test -- --watch=false

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, client]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: image
        shell: bash
        env:
          IMAGE: ${{ needs.verify.outputs.image-prefix }}-${{ matrix.app }}
          VERSION: ${{ needs.verify.outputs.version }}
          STABLE: ${{ needs.verify.outputs.stable }}
        run: |
          {
            echo 'tags<<EOF'
            echo "$IMAGE:$VERSION"
            if [[ "$STABLE" == true ]]; then
              echo "$IMAGE:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
